<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 412 368" role="img" aria-label="Restointelligence">
  <defs>
    <linearGradient id="ri-orange" x1="0" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#FF7A1A"/>
      <stop offset="1" stop-color="#F04E23"/>
    </linearGradient>
  </defs>

  <!-- R : un tracé continu — barre haute, panse ouverte, jambe diagonale.
       La barre est un polygone à part pour obtenir la coupe biaise en haut
       à gauche, parallèle à la jambe ; le reste est tracé au trait. -->
  <g fill="url(#ri-orange)">
    <polygon points="20,21 190,21 190,77 87,77"/>
  </g>
  <path d="M 130 49 H 180 A 68 68 0 0 1 180 185 H 98 L 280 337"
        fill="none" stroke="url(#ri-orange)" stroke-width="56"
        stroke-linejoin="miter" stroke-miterlimit="6" stroke-linecap="butt"/>

  <!-- i : point, puis une hampe fendue en deux par une diagonale
       parallèle aux obliques du R. -->
  <g fill="#1B2B5E">
    <circle cx="359" cy="53" r="33"/>
    <polygon points="328,125 390,101 390,149 328,173"/>
    <path d="M 328 185 L 390 161 L 390 325 A 12 12 0 0 1 378 337 L 340 337 A 12 12 0 0 1 328 325 Z"/>
  </g>
</svg>
